project:
  name: "convnext-hierarchical"
  seed: 42

paths:
  data_root: "."
  taxonomy_csv: "${paths.data_root}/data/taxonomy.csv"
  train_annotations: "${paths.data_root}/data/train/annotations.csv"
  train_image_dir: "${paths.data_root}/data/train/rois"
  test_annotations: "${paths.data_root}/data/test/annotations.csv"
  test_image_dir: "${paths.data_root}/data/test/rois"
  output_dir: "${paths.data_root}/outputs"
  submission_csv: "${paths.output_dir}/submission.csv"

data:
  taxonomy_levels: ["kingdom", "phylum", "class", "order", "family", "genus", "species"]
  train_ratio: 0.7
  val_ratio: 0.15
  eval_ratio: 0.15
  num_workers: 8
  batch_size: 32
  img_size: 224

augmentation:
  random_resized_crop_scale: [0.5, 1.0]
  rotation_degrees: 15
  horizontal_flip: true
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
    hue: 0.0

model:
  backbone: "convnextv2_base.fcmae_ft_in22k_in1k"
  hidden_dim: 1024
  head_dim: 512

training:
  max_epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.05
  label_smoothing: 0.1
  precision: "16-mixed"
  backbone_lr_scale: 0.1
  accumulate_grad_batches: 1

callbacks:
  early_stopping_patience: 10
  monitor_metric: "val_loss"
  monitor_mode: "min"

loss:
  hierarchy_weights:
    kingdom: 0.5
    phylum: 0.75
    class: 1.0
    order: 1.25
    family: 1.5
    genus: 2.0
    species: 2.5

inference:
  # Set to true to enable hierarchical fallback when species confidence is low.
  enable_fallback: true
  confidence_threshold: 0.7
