[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fathomnet"
version = "1.0.0"
description = "Taxonomy-aware deep learning for hierarchical classification of marine species"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dan Zimmerman", email = "dzimmerman2021@fau.edu"}
]
keywords = ["deep-learning", "marine-biology", "image-classification", "hierarchical-classification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "omegaconf>=2.3.0",
    "pytorch-lightning>=2.3.0",
    "timm>=1.0.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "httpx",
    "pillow",
    "coco-lib",
    "kaggle==1.7.4.5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.scripts]
# Training commands
fathomnet-train = "src.training.train_multiscale:main"
fathomnet-train-taxloss = "src.training.train_multiscale_taxloss:main"
fathomnet-train-attention = "src.training.train_multiscale_attention:main"

# Inference commands
fathomnet-predict = "src.inference.generate_submission_multiscale:main"
fathomnet-predict-taxloss = "src.inference.generate_submission_taxloss:main"

[project.urls]
Repository = "https://github.com/z3301/CAP6415_F25_project-Kaggle-FathomNet"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "data*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.csv", "*.json"]
